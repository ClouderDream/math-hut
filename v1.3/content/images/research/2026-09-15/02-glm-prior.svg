<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f5ef"/>
<text x="70" y="85" font-family="Arial,'Noto Sans SC',sans-serif" font-size="42" font-weight="700" fill="#1f2937">GLM-Prior：把基因组语言模型变成可迁移先验</text>
<text x="70" y="130" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" fill="#5b6472">基础模型不直接替代领域推断，而是提供 sequence-derived prior</text>
<rect x="90" y="245" width="260" height="170" rx="22" fill="#e8eef3" stroke="#52606d" stroke-width="4"/>
<text x="145" y="320" font-family="Arial,'Noto Sans SC',sans-serif" font-size="30" font-weight="700" fill="#1f2937">基因组序列</text>
<text x="135" y="365" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" fill="#4b5563">预训练语言模型</text>
<path d="M365 330 H505" stroke="#8b5e3c" stroke-width="7" marker-end="url(#a)"/>
<rect x="515" y="245" width="260" height="170" rx="22" fill="#efe7dc" stroke="#8b5e3c" stroke-width="4"/>
<text x="575" y="320" font-family="Arial,'Noto Sans SC',sans-serif" font-size="30" font-weight="700" fill="#1f2937">可迁移先验</text>
<text x="555" y="365" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" fill="#4b5563">sequence prior</text>
<path d="M790 330 H930" stroke="#8b5e3c" stroke-width="7" marker-end="url(#a)"/>
<rect x="940" y="245" width="180" height="170" rx="22" fill="#e8eef3" stroke="#52606d" stroke-width="4"/>
<text x="985" y="315" font-family="Arial,'Noto Sans SC',sans-serif" font-size="30" font-weight="700" fill="#1f2937">GRN</text>
<text x="967" y="360" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" fill="#4b5563">网络推断</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b5e3c"/></marker></defs>
<text x="70" y="565" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" fill="#374151">范式：基础模型提供先验，领域模型负责可验证推断</text>
</svg>
