<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f7f5ef"/>
<text x="70" y="85" font-family="Arial,'Noto Sans SC',sans-serif" font-size="42" font-weight="700" fill="#1f2937">PanMixer：把隐私与科研效用写进同一个优化问题</text>
<text x="70" y="130" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" fill="#5b6472">选择性混淆 haplotype，在降低攻击风险的同时尽量保留下游分析能力</text>
<line x1="240" y1="500" x2="960" y2="500" stroke="#4b5563" stroke-width="5"/>
<line x1="240" y1="500" x2="240" y2="210" stroke="#4b5563" stroke-width="5"/>
<text x="850" y="545" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" fill="#374151">科研效用 →</text>
<text x="90" y="235" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" fill="#374151" transform="rotate(-90 90 235)">隐私保护 →</text>
<path d="M300 440 C430 400, 520 345, 610 315 S790 260, 900 235" fill="none" stroke="#8b5e3c" stroke-width="9"/>
<circle cx="610" cy="315" r="18" fill="#111827"/>
<text x="635" y="308" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" fill="#1f2937">PanMixer 平衡点</text>
<text x="330" y="585" font-family="Arial,'Noto Sans SC',sans-serif" font-size="24" fill="#374151">不是“公开 / 不公开”二选一，而是优化 privacy–utility trade-off</text>
</svg>
