name: Check Local OCR Toolkit

on:
  push:
    paths:
      - 'tools/local-ocr/**'
      - 'v1.3/src/admin/ocr-workspace.js'
      - '.github/workflows/local-ocr-check.yml'
  pull_request:
    paths:
      - 'tools/local-ocr/**'
      - 'v1.3/src/admin/ocr-workspace.js'
      - '.github/workflows/local-ocr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查 Python 语法
        run: python -m py_compile tools/local-ocr/server.py

      - name: 检查 PowerShell 脚本语法
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools/local-ocr -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell syntax error: $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: 检查关键文件与依赖声明
        shell: python
        run: |
          from pathlib import Path
          root = Path('tools/local-ocr')
          required = [
              'server.py', 'requirements.txt', 'install.ps1', 'start.ps1',
              'stop.ps1', 'update.ps1', 'doctor.ps1', 'bootstrap.ps1',
              'README.md', 'LOCAL_SETUP_CHECKLIST.md'
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit('missing files: ' + ', '.join(missing))
          req = (root / 'requirements.txt').read_text(encoding='utf-8')
          if 'paddleocr[doc-parser]' not in req:
              raise SystemExit('requirements.txt must include paddleocr[doc-parser] for PP-StructureV3')
          if 'paddlepaddle==3.2.2' not in req:
              raise SystemExit('requirements.txt must pin paddlepaddle==3.2.2 to avoid the current CPU oneDNN/PIR regression in 3.3.x')

      - name: 检查已验收兼容修复
        shell: python
        run: |
          from pathlib import Path
          root = Path('tools/local-ocr')
          server = (root / 'server.py').read_text(encoding='utf-8')
          start = (root / 'start.ps1').read_text(encoding='utf-8')
          stop = (root / 'stop.ps1').read_text(encoding='utf-8')

          checks = {
              'Starlette Private Network Access': 'allow_private_network=True' in server,
              'PaddleX markdown_texts compatibility': 'markdown_texts' in server,
              'Project-local PaddleX cache': 'PADDLE_PDX_CACHE_HOME' in start,
              'Paddle BOS preferred source': 'PADDLE_PDX_MODEL_SOURCE' in start and 'BOS' in start,
              'stop.ps1 netstat fallback': 'netstat -ano' in stop,
              'stop.ps1 avoids reserved $PID variable': 'foreach ($pid ' not in stop.lower(),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('missing accepted compatibility fixes: ' + ', '.join(failed))

      - name: 检查 OCR 长任务防中断链路
        shell: python
        run: |
          from pathlib import Path
          server = Path('tools/local-ocr/server.py').read_text(encoding='utf-8')
          ui = Path('v1.3/src/admin/ocr-workspace.js').read_text(encoding='utf-8')
          checks = {
              'server async OCR start endpoint': '@app.post("/ocr/start")' in server,
              'server async OCR status endpoint': '@app.get("/ocr/status/{job_id}")' in server,
              'single-worker OCR queue': 'ThreadPoolExecutor(max_workers=1' in server,
              'browser submits async OCR job': "/ocr/start" in ui,
              'browser polls OCR status': "/ocr/status/" in ui,
              'old 10-minute hard OCR abort removed': "10*60*1000" not in ui and "10 * 60 * 1000" not in ui,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('OCR long-task regression: ' + ', '.join(failed))

      - name: 检查 loopback 安全边界
        shell: python
        run: |
          from pathlib import Path
          text = (Path('tools/local-ocr') / 'server.py').read_text(encoding='utf-8')
          if 'host="0.0.0.0"' in text or "host='0.0.0.0'" in text:
              raise SystemExit('Local OCR must not listen on 0.0.0.0 by default')
          if '127.0.0.1' not in text:
              raise SystemExit('Expected loopback-only default host')
